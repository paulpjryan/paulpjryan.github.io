<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>PJ Ryan</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500&family=Saira+Condensed:wght@600&display=swap"
    />
    <style>
      :root {
        --bg: #ebeff2;
        --ink: #15212c;
        --muted: #5b6976;
        --line: #cbd3da;
        --accent: #e0531a;
        --f-display: 'Saira Condensed', 'Arial Narrow', system-ui, sans-serif;
        --f-body: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #10161c;
          --ink: #e4eaef;
          --muted: #93a2af;
          --line: #2b3744;
          --accent: #ff6a2b;
          color-scheme: dark;
        }
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font: 15px/1.5 var(--f-body);
        padding: 24px max(16px, env(safe-area-inset-left, 0px)) 48px;
      }
      header,
      main {
        max-width: 640px;
        margin: 0 auto;
      }
      h1,
      h2 {
        font-family: var(--f-display);
        font-weight: 600;
        line-height: 1;
        letter-spacing: 0.01em;
      }
      header {
        padding-bottom: 20px;
        margin-bottom: 28px;
        border-bottom: 2px solid var(--accent);
      }
      h1 {
        font-size: 2.6rem;
        color: var(--accent);
        margin: 0;
      }
      h2 {
        font-size: 1.5rem;
        margin: 0 0 12px;
      }
      ul {
        list-style: none;
        margin: 0;
        padding: 0;
        border-top: 1px solid var(--line);
      }
      li {
        padding: 12px 0;
        border-bottom: 1px solid var(--line);
      }
      a {
        color: var(--ink);
        font-weight: 500;
        text-decoration: none;
      }
      a:hover {
        color: var(--accent);
      }
      li p {
        margin: 2px 0 0;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <header>
      <h1>PJ Ryan</h1>
    </header>
    <main>
      <h2>Pages</h2>
      <ul>
        <li>
          <a href="rhythm/">Pocket Meter</a>
          <p>Rhythm guitar practice tool: timing and dynamics measured against a click.</p>
        </li>
      </ul>
    </main>
  </body>
</html>
